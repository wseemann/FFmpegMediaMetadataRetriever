apply plugin: 'com.android.library'
apply from: "$rootProject.projectDir/publishing.gradle"

def abiConfigs = [
    'all':    [mkfile: 'NDK_APPLICATION_MK=Application.mk',       aarname: 'all-fmmr',    pomName: 'FFmpegMediaMetadataRetriever-native'],
    'armv7':  [mkfile: 'NDK_APPLICATION_MK=ARMv7Application.mk',  aarname: 'armv7-fmmr',  pomName: 'FFmpegMediaMetadataRetriever-native-armeabi-v7a'],
    'x86':    [mkfile: 'NDK_APPLICATION_MK=x86Application.mk',    aarname: 'x86-fmmr',    pomName: 'FFmpegMediaMetadataRetriever-native-x86'],
    'x86_64': [mkfile: 'NDK_APPLICATION_MK=x86_64Application.mk', aarname: 'x86_64-fmmr', pomName: 'FFmpegMediaMetadataRetriever-native-x86_64'],
    'arm64':  [mkfile: 'NDK_APPLICATION_MK=ARM_64Application.mk', aarname: 'arm_64-fmmr', pomName: 'FFmpegMediaMetadataRetriever-native-arm64-v8a'],
]

def selectedAbi = project.findProperty('abi') ?: 'all'
def config = abiConfigs[selectedAbi]
def mkfile = config.mkfile
def aarname = config.aarname
def pomName = config.pomName
def pomArtifactId = pomName

android {
    namespace 'wseemann.media.ffmpeg'

    compileSdk Integer.parseInt(libs.versions.compileSdk.get())

    defaultConfig {
        minSdkVersion Integer.parseInt(libs.versions.minSdk.get())
        targetSdkVersion Integer.parseInt(libs.versions.targetSdk.get())
        ndkVersion libs.versions.ndk.get()

        ndk {
            abiFilters 'armeabi-v7a', 'x86', 'x86_64', 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    publishing {
        singleVariant('release')
    }

    sourceSets.main {
        jniLibs.srcDir 'src/main/libs' // This is not necessary unless you have precompiled libraries in your project.
    }

}

println "$mkfile"
println "$aarname"
println "$pomName"
println "$pomArtifactId"

task buildFFmpeg(type: Exec, description: 'Compile FFmpeg source via NDK') {
    def pwd = "$rootProject.projectDir/native/src/main/ffmpeg"
    def dir = file('src/main/ffmpeg/build.sh').absolutePath
    commandLine "$dir", "$pwd"
}

task buildNative(type: Exec, description: 'Compile JNI source via NDK') {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    def ndkDir = properties.getProperty('ndk.dir')
    // def ndkDir = android.ndkDirectory
    println mkfile
    commandLine "$ndkDir/ndk-build",
            mkfile,
            'NDK_LIBS_OUT=../jniLibs', // Output .so files to jniLibs
            '-C', file('src/main/jni').absolutePath, // Change src/main/jni the relative path to your jni source
            '-j', Runtime.runtime.availableProcessors(),
            'all',
            'NDK_DEBUG=1'
}

task cleanNative(type: Exec, description: 'Clean JNI object files') {
    delete "$project.projectDir/src/main/libs"
    delete "$project.projectDir/src/main/jniLibs"
    delete "$project.projectDir/src/main/obj"
    delete project.buildDir
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    def ndkDir = properties.getProperty('ndk.dir')
    // def ndkDir = android.ndkDirectory
    commandLine "$ndkDir/ndk-build",
            '-C', file('src/main/jni').absolutePath, // Change src/main/jni the relative path to your jni source
            'clean'
}

clean.dependsOn 'cleanNative'
// buildNative.dependsOn 'buildFFmpeg'
preBuild.dependsOn 'buildNative'

base {
    archivesName = aarname
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.wseemann'
                artifactId = "$pomArtifactId"
                version = libs.versions.versionName.get()

                pom {
                    name = "$pomName"
                    description = 'FFmpegMediaMetadataRetriever library'
                    url = 'https://github.com/wseemann/FFmpegMediaMetadataRetriever'
                    packaging = 'aar'
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'wseemann'
                            name = 'William Seemann'
                        }
                    }
                    scm {
                        connection = 'scm:hg:https://github.com/wseemann/FFmpegMediaMetadataRetriever'
                        developerConnection = 'scm:hg:https://github.com/wseemann/FFmpegMediaMetadataRetriever'
                        url = 'https://github.com/wseemann/FFmpegMediaMetadataRetriever'
                    }
                }
            }
        }
    }
}

dependencies {
    testImplementation(libs.junit)
    androidTestImplementation(libs.androidx.annotation)
    androidTestImplementation(libs.androidx.runner)
    androidTestImplementation(libs.androidx.rules)
}
